name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Lint, analyse and test
        run: composer check

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'

      - run: composer install --no-interaction --no-progress
      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Start WordPress + WooCommerce
        run: npm run env:start

      - name: Configure the plugin
        run: npx wp-env run cli wp eval-file wp-content/plugins/takt-wordpress/e2e/setup-wp.php

      - name: Run end-to-end tests
        run: npx playwright test --grep-invert @route-templates

      - name: Configure route templates
        run: npx wp-env run cli wp eval-file wp-content/plugins/takt-wordpress/e2e/setup-route-templates.php

      - name: Run route template end-to-end tests
        run: npx playwright test --grep @route-templates

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          coverage: none

      - name: Build the release ZIP
        run: bin/build.sh

      - name: Upload the release ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: takt-analytics-zip
          path: dist/takt-analytics.zip
          if-no-files-found: error
